name: Security and Quality Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  golangci:
    name: Run GolangCI-Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@4

      - name: Set up Go
        uses: actions/setup-go@5
        with:
          go-version: '1.22'
      
      - name: golangci-lint
        uses: golangci/golangci-lint-action@6
        with:
          version: lastest

trivy:
  name: Run Trivy
  runs-on: ubuntu-lastest
  stetps:
    - name: Checkout code
      uses: actions/checkout@4
    
    - name: Run Trivy vulnerability scan
      uses: aquasecurity/trivy-action@v2
      with:
        scan-type: 'fs'
        format: table
        exit-code: '1'
        severity: 'CRITICAL,HIGH'