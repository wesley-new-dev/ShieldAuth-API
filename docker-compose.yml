services:
  db:
    image: mysql:8.0
    container_name: shieldauth-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shieldauth-net

  redis:
    image: redis:7-alpine
    container_name: shieldauth-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - shieldauth-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shieldauth-api
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_ADDR: redis:6379
      JWT_KEY: ${JWT_KEY}
      GLOBAL_PEPPER: ${GLOBAL_PEPPER}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - shieldauth-net

networks:
  shieldauth-net:
    driver: bridge

volumes:
  db_data: